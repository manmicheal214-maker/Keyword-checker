name: Check Rankings

on:
  schedule:
    # Run daily at 9:00 AM IST (03:30 UTC)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  check-rankings:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check rankings
        run: npm run check-rankings
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/rankings.json data/history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update rankings and history data"

      - name: Push changes
        run: git push
